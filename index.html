/* ---------- cake rendering ---------- */

let dripSrc=null; const dripCache={};
function dripURL(h,s,l){
  const key=[h,s,l].map(v=>v.toFixed(1)).join(',');
  if(dripCache[key])return dripCache[key];
  const c=document.createElement('canvas');c.width=dripSrc.width;c.height=dripSrc.height;
  const x=c.getContext('2d');x.drawImage(dripSrc,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  const T=hsl2rgb(h,s,l), LB=0.299*0xd9+0.587*0x57+0.114*0x44, FM=255/LB;
  for(let i=0;i<p.length;i+=4){
    if(!p[i+3])continue;
    const f=(0.299*p[i]+0.587*p[i+1]+0.114*p[i+2])/LB;
    for(let k=0;k<3;k++)p[i+k]= f<=1 ? T[k]*f : T[k]+(255-T[k])*Math.min(1,(f-1)/(FM-1));
  }
  x.putImageData(d,0,0);

}

/* cream rows: fewer, roomier beads than before */
const BEAD_W=84, BEAD_GAP=80;
const ROWS={};
function rowPoints(row){
  if(ROWS[row])return ROWS[row];
  const pts=[], full=row==='top';
  const cy=row==='top'?CK.ty:row==='mid'?(CK.ty+CK.by)/2:CK.by;
  const a1=full?Math.PI*2:Math.PI, N=900;
  let L=[0],prev=[CK.cx+CK.rx,cy];const P=[prev];
  for(let i=1;i<=N;i++){const t=a1*i/N,q=[CK.cx+CK.rx*Math.cos(t),cy+CK.ry*Math.sin(t)];L.push(L[i-1]+Math.hypot(q[0]-prev[0],q[1]-prev[1]));P.push(q);prev=q}
  const total=L[N], n=Math.round(total/BEAD_GAP), step=total/n;
  let j=0;
  for(let k=0;k<(full?n:n+1);k++){const target=k*step;while(j<N&&L[j+1]<target)j++;pts.push(P[j])}
  return ROWS[row]=pts;
}
const NS='http://www.w3.org/2000/svg';
function svgImg(g,href,x,y,w,h){const im=document.createElementNS(NS,'image');im.setAttribute('href',href);
  im.setAttribute('x',x);im.setAttribute('y',y);im.setAttribute('width',w);im.setAttribute('height',h);g.appendChild(im);return im}
function beadsOf(rows){
  const all=[];
  for(const row of rows){const map=state.cream[row];
    rowPoints(row).forEach(([x,y],i)=>{const id=map[i];if(id==null)return;
      const [bw,bh]=META.bead[id], w=BEAD_W, h=BEAD_W*bh/bw, oy=row==='bot'?-h*.62:row==='mid'?-h*.5:-h*.55;
      all.push({x:x-w/2,y:y+oy,w,h,id,z:y})})}
  return all.sort((a,b)=>a.z-b.z);
}
function paintCream(){
  const back=$('creamG'),front=$('creamF'),pipes=$('pipeG');back.innerHTML='';front.innerHTML='';pipes.innerHTML='';
  beadsOf(['top','mid']).forEach(b=>svgImg(back,`a/bead_${b.id}.png`,b.x,b.y,b.w,b.h));
  beadsOf(['bot']).forEach(b=>svgImg(front,`a/bead_${b.id}.png`,b.x,b.y,b.w,b.h));
  for(const p of state.pipes){const [bw,bh]=META.bead[p.id],w=BEAD_W,h=BEAD_W*bh/bw;
    for(const [x,y] of p.pts)svgImg(pipes,`a/bead_${p.id}.png`,x-w/2,y-h*.6,w,h)}
}
/* ladyfingers standing side by side around the front of the cake */
const FINGER_H=(CK.by-CK.ty)+30, FINGER_W=FINGER_H*137/363;
const SLOTS=(()=>{const out=[],wAt=x=>FINGER_W*Math.max(.28,Math.sqrt(Math.max(0,1-((x-CK.cx)/CK.rx)**2)));
  const lim=CK.rx*.985;let xs=[CK.cx];
  let x=CK.cx;for(let guard=0;guard<60;guard++){const w=wAt(x);let nx=x+w*.92;nx=x+(w+wAt(nx))/2*.92;if(nx>CK.cx+lim)break;xs.push(nx);xs.unshift(2*CK.cx-nx);x=nx}
  xs.forEach(x=>{const t=(x-CK.cx)/CK.rx,sn=Math.sqrt(Math.max(0,1-t*t)),w=wAt(x),bottom=CK.by+CK.ry*sn+8;
    out.push({x,w,y:bottom-FINGER_H,h:FINGER_H,z:sn})});
  return out})();
function paintFingers(){
  const g=$('fingerG');g.innerHTML='';
  SLOTS.map((s,i)=>({s,i})).filter(o=>state.fingers[o.i]).sort((a,b)=>a.s.z-b.s.z)
    .forEach(({s})=>svgImg(g,'a/finger.png',s.x-s.w/2,s.y,s.w,s.h).setAttribute('preserveAspectRatio','none'));
}

/* ---------- placed items: move / resize / rotate ---------- */

let gest=null;
function startGesture(type,e,it,el){

SB.querySelectorAll('[data-h]').forEach(h=>h.addEventListener('pointerdown',e=>{

  if(!gest||e.pointerId!==gest.id)return;const g=gest,p=toStage(e),it=g.it;

  if(g.type==='move'){const dx=p.x-g.p0.x,dy=p.y-g.p0.y;g.dx=dx;g.dy=dy;
    g.el.style.transform=itemTf(it,dx,dy);paintSel(dx,dy);g.el.style.opacity=inCake(it.x+dx,it.y+dy)?1:.45;return}
  const a0=Math.atan2(g.p0.y-it.y,g.p0.x-it.x),a1=Math.atan2(p.y-it.y,p.x-it.x);
  if(g.type==='scale'){const d0=Math.hypot(g.p0.x-it.x,g.p0.y-it.y),d1=Math.hypot(p.x-it.x,p.y-it.y);it.s=clamp(g.s0*d1/Math.max(d0,1),.35,2.6)}

addEventListener('pointerup',e=>{
  if(!gest||e.pointerId!==gest.id)return;const g=gest;gest=null;if(!g.moved)return;
  const it=g.it;

function render(){paintCake();paintDrip();paintCream();paintFingers();paintItems();paintGuides();refreshOn();paintHint();trackActions();}
function inCake(x,y){
  const {cx,ty,rx,ry,by}=CK;
  if(((x-cx)/(rx+34))**2+((y-ty)/(ry+34))**2<=1)return true;
  if(Math.abs(x-cx)<=rx+24 && y>=ty){const t=clamp((x-cx)/rx,-1,1);return y<=by+ry*Math.sqrt(1-t*t)+24}
  return false;
}

/* ---------- what the next tap on the cake will do ---------- */
// arm = {kind:'item', i, tint?} | {kind:'cream', i, mode:'free'|'guide'} | {kind:'finger', mode:'free'|'guide'}
let arm=null;
const FINGER_ITEM=1;   // 餅乾&糖果 → 手指餅乾
function paintHint(){

    else if(arm.kind==='cream')t=arm.mode==='free'?'用手指在蛋糕上畫，擠出奶油':'手指沿著虛線滑過去，奶油就會排好';
    else if(arm.kind==='finger')t=arm.mode==='free'?'點一下蛋糕，放上一根手指餅乾':'手指沿著蛋糕側面的虛線滑過去';
  }

}
const PBAG={}; // shuffled bag per candy so each colour appears equally often
function placeSpec(i){const it=META[curCat.key][i];
  // candy that shows several pieces in the menu goes onto the cake one piece at a time, picked at random
  if(it.pieces&&it.pieces.length){const bag=PBAG[it.id]=(PBAG[it.id]&&PBAG[it.id].length)?PBAG[it.id]:[...it.pieces].sort(()=>Math.random()-.5);const [src,pw,ph]=bag.pop();
    let k=K_PLACE*1.2;if(Math.max(pw,ph)*k<80)k=80/Math.max(pw,ph);return {src,w:pw*k,h:ph*k};}
  const src=it.place||it.id, w=(it.pw||it.w)*K_PLACE, h=(it.ph||it.h)*K_PLACE;return {src,w,h};}
function addItem(sp,p,tint){
  commit(snap());const it={uid:uid++,src:sp.src,x:p.x,y:p.y,w:sp.w,h:sp.h,s:1,r:0};if(tint)it.tint=tint;

let stroke=null;
$('tapL').addEventListener('pointerdown',e=>{

  if(arm.kind==='item'){addItem(placeSpec(arm.i),p,arm.tint);return}
  if(arm.kind==='finger'){const pc=META.cookie[FINGER_ITEM].pieces[0];addItem({src:pc[0],w:pc[1]*K_PLACE*1.2,h:pc[2]*K_PLACE*1.2},p);return}
  if(arm.kind==='cream'&&arm.mode==='free'){
    sel=null;paintSel();
    stroke={before:snap(),id:e.pointerId,last:p,pipe:{id:arm.i,pts:[[p.x,p.y]]}};state.pipes.push(stroke.pipe);paintCream();

});

  if(!stroke||e.pointerId!==stroke.id)return;const p=toStage(e);

  if(d>=BEAD_GAP*.8){const n=Math.floor(d/(BEAD_GAP*.8));
    for(let k=1;k<=n;k++){const t=k*BEAD_GAP*.8/d;stroke.pipe.pts.push([stroke.last.x+(p.x-stroke.last.x)*t,stroke.last.y+(p.y-stroke.last.y)*t])}
    const L=stroke.pipe.pts[stroke.pipe.pts.length-1];stroke.last={x:L[0],y:L[1]};paintCream()}

/* ---------- dashed guides (cream rows, ladyfinger band): slide along them, or tap to fill all ---------- */
function bandPath(cy){const {cx,rx,ry}=CK,R=rx+16,u=cy-44,d=cy+44;
  return `M${cx+R} ${u} A${R} ${ry} 0 0 1 ${cx-R} ${u} L${cx-R} ${d} A${R} ${ry} 0 0 0 ${cx+R} ${d} Z`;}

    const ring=`M${cx+rx+48} ${ty} A${rx+48} ${ry+38} 0 1 0 ${cx-rx-48} ${ty} A${rx+48} ${ry+38} 0 1 0 ${cx+rx+48} ${ty} Z M${cx+rx-46} ${ty} A${rx-46} ${ry-32} 0 1 1 ${cx-rx+46} ${ty} A${rx-46} ${ry-32} 0 1 1 ${cx+rx-46} ${ty} Z`;
    g.innerHTML=`<path data-row="top" fill-rule="evenodd" d="${ring}"/><path data-row="mid" d="${bandPath((ty+by)/2)}"/><path data-row="bot" d="${bandPath(by)}"/>`;
  }else{
    g.innerHTML=`<path data-row="finger" d="M${cx-rx-14} ${ty-20} L${cx-rx-14} ${by} A${rx+14} ${ry+20} 0 0 0 ${cx+rx+14} ${by} L${cx+rx+14} ${ty-20} A${rx+14} ${ry+20} 0 0 1 ${cx-rx-14} ${ty-20} Z"/>`;
  }

}
let trace=null;
function slotsOf(row){return row==='finger'?SLOTS.map(s=>[s.x,s.y+s.h*.5]):rowPoints(row)}
function fillNear(row,p){
  const map=row==='finger'?state.fingers:state.cream[row],val=row==='finger'?true:arm.i;let ch=false;
  slotsOf(row).forEach(([x,y],i)=>{const near=row==='finger'?Math.abs(x-p.x)<FINGER_W*.6:Math.hypot(x-p.x,y-p.y)<78;
    if(near&&map[i]!==val){map[i]=val;ch=true}});

// paging with arrow buttons instead of swiping (swiping kept firing taps by accident)

/* ---------- pop-ups (colour palette, bow colours, free/dashed choice) ---------- */

function qQuestion(n,pre){

}
function qBuildOptions(n){

  const keys=['all','A','B','C','D','E'],imgs=keys.map(k=>{const i=qimg(`q${n}_${k}`);el.appendChild(i);return i});
  const show=i=>imgs.forEach((m,j)=>m.classList.toggle('on',j===(i==null?0:i+1)));show(qAns[n-1]);
  QG.hits['q'+n].forEach((r,i)=>{const h=qdiv('qhit',r);h.onclick=()=>{if(qBusy)return;qAns[n-1]=i;show(i)};el.appendChild(h)});

    const nextImg=n<4?qimg('q'+(n+1)+'_q'):null;
    const after=()=>{qBusy=false;n<5?qQuestion(n+1,nextImg):qResult()};
